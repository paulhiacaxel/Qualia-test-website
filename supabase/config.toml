# Local development only. No hosted project is linked by this file.
# Confirm the hosted PostgreSQL major version before linking/pushing migrations.
project_id = "qualia"

[api]
enabled = true
port = 54321
# Never expose the private schema: it contains addresses and admin membership.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# No demo hosts, fake ratings, or production fixture accounts.
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
# Local emails are caught in this inbox, never delivered to real recipients.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"
# The phase 2 migration creates the private listing-photos bucket and its RLS policies.

[auth]
enabled = true
site_url = "http://localhost:3000"
# Exact local redirects used by the application; add the selected real domain
# to hosted Auth settings when deploying, never an unrestricted wildcard.
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/callback?next=%2Faccount%2Fdashboard",
  "http://localhost:3000/auth/callback?next=%2Fhost%2Fstart",
  "http://localhost:3000/auth/callback?next=%2Faccount%2Fupdate-password",
  "http://localhost:3000/auth/callback?next=%2Fhost%2Fdashboard",
  "http://localhost:3000/auth/callback?next=%2Fadmin",
  "http://localhost:3000/auth/confirm"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Production requires an authenticated email provider and the chosen domain.
# Do not put SMTP or service-role secrets in this committed configuration.
