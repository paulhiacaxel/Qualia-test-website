<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host dashboard — Qualia</title>
<link rel="icon" type="image/svg+xml" href="../brand_assets/qualia-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>window.QUALIA_BASE = '../';</script>
<script src="../assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-paper text-ink font-sans antialiased">

<!-- ================= NAV ================= -->
<header class="sticky top-0 z-50 bg-paper/90 backdrop-blur-md border-b border-line">
  <nav class="max-w-[1200px] mx-auto flex items-center justify-between px-6 md:px-10 py-4">
    <a href="../index.html" class="flex items-center" aria-label="Qualia home">
      <img src="../brand_assets/qualia-logo-horizontal.svg" alt="Qualia" class="h-6 md:h-7 w-auto">
    </a>
    <div class="hidden md:flex items-center gap-8">
      <a href="../discover.html" class="nav-link">Discover</a>
      <a href="../index.html#how-it-works" class="nav-link">How it works</a>
      <a href="../index.html#safety" class="nav-link">Trust &amp; safety</a>
      <a href="../index.html#hosts" class="nav-link">For hosts</a>
    </div>
    <div class="flex items-center gap-4">
      <div id="auth-slot" class="hidden md:flex items-center gap-4"></div>
      <button type="button" data-mobile-toggle class="md:hidden w-9 h-9 flex items-center justify-center text-ink" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </nav>
</header>

<div class="mobile-drawer">
  <div class="scrim"></div>
  <div class="panel">
    <div class="flex items-center justify-between mb-8">
      <img src="../brand_assets/qualia-logo-horizontal.svg" alt="Qualia" class="h-6 w-auto">
      <button type="button" data-mobile-close class="w-9 h-9 flex items-center justify-center" aria-label="Close menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="flex flex-col mb-8">
      <a href="../discover.html" class="py-3.5 text-[15px] font-medium text-ink border-b border-line">Discover</a>
      <a href="../index.html#how-it-works" class="py-3.5 text-[15px] font-medium text-ink border-b border-line">How it works</a>
      <a href="../index.html#safety" class="py-3.5 text-[15px] font-medium text-ink border-b border-line">Trust &amp; safety</a>
      <a href="../index.html#hosts" class="py-3.5 text-[15px] font-medium text-ink border-b border-line">For hosts</a>
    </nav>
    <div id="auth-slot-mobile" class="flex flex-col gap-3 mt-auto"></div>
  </div>
</div>

<!-- ================= LOCKED STATE ================= -->
<div id="portal-locked" class="max-w-[560px] mx-auto px-6 py-24 text-center hidden">
  <span class="inline-block w-12 h-12 rounded-full border-[1.6px] border-moss/50 mb-6"></span>
  <h1 class="font-display font-medium text-[26px] mb-3">This is a host dashboard.</h1>
  <p class="text-inksoft text-[14.5px] leading-[1.7] mb-8">Log in as a host to manage your listings, availability, and bookings.</p>
  <div class="flex flex-col sm:flex-row gap-3 justify-center">
    <a href="../login.html?mode=signup&role=host&next=host/dashboard.html" class="btn btn-primary">Log in as host</a>
    <a href="../login.html?next=host/dashboard.html" id="demo-host-link" class="btn btn-outline">Continue as demo host</a>
  </div>
</div>

<!-- ================= PORTAL CONTENT ================= -->
<main id="portal-content" class="hidden">

  <section class="border-b border-line bg-paperalt/40">
    <div class="max-w-[1200px] mx-auto px-6 md:px-10 pt-12 pb-6 md:pt-14">
      <span class="eyebrow block mb-3">Host portal</span>
      <h1 class="font-display font-medium text-[30px] md:text-[36px] tracking-[-0.01em] mb-6" id="welcome-heading">Welcome back.</h1>
      <div class="tab-underline">
        <button type="button" class="active">Dashboard</button>
        <a href="create-experience.html"><button type="button">Create experience</button></a>
        <a href="calendar.html"><button type="button">Availability calendar</button></a>
      </div>
    </div>
  </section>

  <section class="max-w-[1200px] mx-auto px-6 md:px-10 py-12">

    <div id="stat-tiles" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-14"></div>

    <div class="flex items-center justify-between mb-6">
      <h2 class="font-display font-medium text-[22px]">Your listings</h2>
      <a href="create-experience.html" class="btn btn-primary btn-sm">+ New experience</a>
    </div>
    <div id="listings-wrap" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mb-16"></div>

    <h2 class="font-display font-medium text-[22px] mb-6">Bookings</h2>
    <div id="bookings-wrap" class="border border-line rounded-2xl overflow-hidden"></div>

  </section>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  document.getElementById('demo-host-link').addEventListener('click', function(e){
    e.preventDefault();
    var account = QUALIA_STORE.findAccountByEmail('rosa@demo.qualia');
    QUALIA_STORE.setSession(account);
    window.location.href = 'dashboard.html';
  });

  var session = QUALIA_STORE.getSession();
  if (!session || session.role !== 'host'){
    document.getElementById('portal-locked').classList.remove('hidden');
    return;
  }
  document.getElementById('portal-content').classList.remove('hidden');

  var hostId = session.hostId;
  var hostRecord = QUALIA_DATA.getHost(hostId);
  document.getElementById('welcome-heading').textContent = 'Welcome back, ' + session.name.split(' ')[0] + '.';

  function resolveListing(expId){
    return QUALIA_DATA.getExperience(expId) || QUALIA_STORE.getListings().find(function(l){ return l.id === expId; });
  }
  function money(n){ return '$' + Math.round(n).toLocaleString('en-US'); }

  var seedExperiences = QUALIA_DATA.getExperiencesByHost(hostId).map(function(e){
    return Object.assign({}, e, { status: 'live' });
  });
  var draftListings = QUALIA_STORE.getListingsForHost(hostId);
  var allListings = seedExperiences.concat(draftListings);
  var bookings = QUALIA_STORE.getBookingsForHost(hostId).sort(function(a,b){ return a.date < b.date ? -1 : 1; });

  /* ---------- stat tiles ---------- */
  var upcoming = bookings.filter(function(b){ return !QUALIA_STORE.isPastISO(b.date) && b.status !== 'cancelled'; }).length;
  var earnings = bookings.filter(function(b){ return b.status === 'confirmed' || b.status === 'completed'; })
    .reduce(function(sum,b){ return sum + b.total; }, 0) * 0.85;

  var tiles = [
    { label: 'Upcoming bookings', value: upcoming },
    { label: 'All-time earnings', value: money(earnings) },
    { label: 'Average rating', value: hostRecord ? hostRecord.rating.toFixed(2) + '★' : '—' },
    { label: 'Response rate', value: hostRecord ? hostRecord.responseRate + '%' : '—' }
  ];
  document.getElementById('stat-tiles').innerHTML = tiles.map(function(t){
    return '<div class="stat-tile"><p class="stat-label">' + t.label + '</p><p class="stat-value">' + t.value + '</p></div>';
  }).join('');

  /* ---------- listings ---------- */
  var statusLabel = { live: 'Live', review: 'In review', consult: 'Consultation requested', changes: 'Changes requested', draft: 'Draft' };
  var listingsWrap = document.getElementById('listings-wrap');
  if (!allListings.length){
    listingsWrap.innerHTML = '<div class="empty-state sm:col-span-2 lg:col-span-3"><p class="font-display text-[18px] mb-2">No experiences yet.</p><p class="text-inksoft text-[14px] mb-6">Submit your first one — it\'ll enter review before it goes live.</p><a href="create-experience.html" class="btn btn-primary">Create an experience</a></div>';
  } else {
    listingsWrap.innerHTML = allListings.map(function(l){
      var inner =
        '<div class="photo-treat aspect-[16/10]"><img src="https://placehold.co/560x350/' + l.img + '/F1EADA?text=' + encodeURIComponent((l.category||'').split(' ')[0] || 'Qualia') + '" alt="" class="w-full h-full object-cover"></div>' +
        '<div class="p-5">' +
          '<div class="flex items-center justify-between mb-2 gap-2"><span class="status status-' + l.status + '">' + statusLabel[l.status] + '</span><span class="font-display font-semibold text-[15px]">$' + l.price + '</span></div>' +
          '<p class="font-display text-[15.5px] font-medium leading-snug mb-1">' + l.title + '</p>' +
          '<p class="font-mono text-[10px] uppercase tracking-[0.05em] text-inksoft">' + l.category + ' · ' + l.location + '</p>' +
        '</div>';
      var card = '<div class="bg-card border border-line rounded-2xl overflow-hidden shadow-brand-sm">' + inner + '</div>';
      if (l.status === 'live') card = '<a href="../experience.html?id=' + l.id + '" class="block bg-card border border-line rounded-2xl overflow-hidden shadow-brand-sm card-hover">' + inner + '</a>';
      return card;
    }).join('');
  }

  /* ---------- bookings ---------- */
  var bookingStatusLabel = { pending: 'Pending', confirmed: 'Confirmed', completed: 'Completed', cancelled: 'Cancelled' };
  var bookingsWrap = document.getElementById('bookings-wrap');
  function renderBookings(){
    bookings = QUALIA_STORE.getBookingsForHost(hostId).sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    if (!bookings.length){
      bookingsWrap.innerHTML = '<div class="empty-state m-4"><p class="text-inksoft text-[14px]">No bookings yet — once a guest requests to book, it\'ll show up here.</p></div>';
      return;
    }
    bookingsWrap.innerHTML = bookings.map(function(b){
      var exp = resolveListing(b.experienceId);
      var title = exp ? exp.title : 'Experience';
      var actions = '';
      if (b.status === 'pending'){
        actions =
          '<button type="button" class="btn btn-sm btn-primary" data-confirm="' + b.id + '">Confirm</button>' +
          '<button type="button" class="btn btn-sm btn-danger" data-decline="' + b.id + '">Decline</button>';
      }
      return '<div class="flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-6 p-5 border-b border-line last:border-b-0">' +
        '<div class="min-w-0 flex-1"><p class="text-[14.5px] font-semibold text-ink truncate">' + title + '</p><p class="font-mono text-[11px] text-inksoft uppercase tracking-[0.04em]">' + b.guestName + ' · ' + QUALIA_STORE.displayDate(b.date) + ' · ' + b.time + ' · ' + b.guests + (b.guests===1?' guest':' guests') + '</p></div>' +
        '<span class="status status-' + b.status + ' shrink-0">' + bookingStatusLabel[b.status] + '</span>' +
        '<span class="font-mono text-[13px] shrink-0 w-16 text-right">$' + b.total + '</span>' +
        '<div class="flex gap-2 shrink-0">' + actions + '</div>' +
      '</div>';
    }).join('');

    bookingsWrap.querySelectorAll('[data-confirm]').forEach(function(btn){
      btn.addEventListener('click', function(){
        QUALIA_STORE.updateBooking(btn.getAttribute('data-confirm'), { status: 'confirmed' });
        QUALIA_APP.toast('Booking confirmed — the guest has been notified.');
        renderBookings();
      });
    });
    bookingsWrap.querySelectorAll('[data-decline]').forEach(function(btn){
      btn.addEventListener('click', function(){
        QUALIA_STORE.updateBooking(btn.getAttribute('data-decline'), { status: 'cancelled' });
        QUALIA_APP.toast('Booking declined.');
        renderBookings();
      });
    });
  }
  renderBookings();

})();
</script>
</body>
</html>
